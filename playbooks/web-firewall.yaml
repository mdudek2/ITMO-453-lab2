---
- name: Configure UFW
  hosts: lab2-webservers
  become: true
  become_method: sudo
  
  vars:
    ansible_user: admin
    ansible_ssh_private_key_file: /home/maks/.ssh/lab2-ssh-key
  
  # firewall rules for web servers
  tasks:
    - name: Reset UFW Firewall
      community.general.ufw:
        state: reset

    - name: Add Default deny incoming rule
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Add Default allow outgoing rule
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Allow SSH Access
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow HTTP Access
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Allow HTTPS Access
      community.general.ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Enable UFW Firewall Service
      community.general.ufw:
        state: enabled